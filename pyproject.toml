[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-course-assistant"
version = "0.3.0"
description = "CFG/Earley parser, TF-IDF retrieval and grounded local-LLM (Ollama) Course Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.5,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
course-assistant = "course_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
