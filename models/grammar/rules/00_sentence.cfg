# Tầng 1 — Khung câu: lời dẫn + phát ngôn + lời kết; danh sách nhãn QUERY
# Thuộc grammar Course Assistant; các file trong thư mục này được nạp theo thứ tự tên.
#
#   S -> OPENER UTTERANCE CLOSER
#   UTTERANCE -> QUERY_<intent>                       (tầng 4: intent)
#   QUERY_<intent> -> <intent>_WH_QUESTION            (loại câu, ví dụ SCHEDULE_WH_QUESTION)
#                   | <intent>_YES_NO_QUESTION
#                   | <intent>_REQUEST
#                   | <intent>_FOLLOW_UP


S -> OPENER UTTERANCE CLOSER

# Lời dẫn (tùy chọn)
OPENER ->
OPENER -> "cho biết"
OPENER -> "cho tôi biết"
OPENER -> "cho mình biết"
OPENER -> "xin cho biết"
OPENER -> "vui lòng cho biết"
OPENER -> "hãy cho biết"
OPENER -> "cho hỏi"
OPENER -> "cho tôi hỏi"
OPENER -> "cho mình hỏi"
OPENER -> "xin hỏi"
OPENER -> "tôi muốn biết"

# Lời kết: trợ từ cuối câu và dấu câu (tùy chọn)
CLOSER ->
CLOSER -> "?"
CLOSER -> "."
CLOSER -> PARTICLE PUNCT
PARTICLE -> "vậy"
PARTICLE -> "ạ"
PARTICLE -> "vậy ạ"
PARTICLE -> "nhỉ"
PARTICLE -> "thế"
PARTICLE -> "thế ạ"
PUNCT ->
PUNCT -> "?"
PUNCT -> "."

# Phát ngôn: mỗi nhãn QUERY_* là một intent (tầng 4)
UTTERANCE -> QUERY_COURSE_INFO
UTTERANCE -> QUERY_COURSE_QUANTITY
UTTERANCE -> QUERY_GET_SCHEDULE
UTTERANCE -> QUERY_GET_TOPIC
UTTERANCE -> QUERY_DEFINITION
UTTERANCE -> QUERY_PROCESS
UTTERANCE -> QUERY_COMPARISON
UTTERANCE -> QUERY_TOPIC_EXPLANATION
UTTERANCE -> QUERY_TOPIC_LIST
UTTERANCE -> QUERY_TOPIC_FORMULA
UTTERANCE -> QUERY_TOPIC_SLIDE
UTTERANCE -> QUERY_GET_ASSIGNMENT
UTTERANCE -> QUERY_CHAPTER_EXERCISE
UTTERANCE -> QUERY_GET_DEADLINE
UTTERANCE -> QUERY_GET_RESOURCE
UTTERANCE -> QUERY_GET_RULE
UTTERANCE -> QUERY_GET_INSTRUCTOR
UTTERANCE -> QUERY_GET_LO
UTTERANCE -> QUERY_CONTEXT
