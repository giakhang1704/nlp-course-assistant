# Tầng 3b — Câu yêu cầu: [động từ yêu cầu] + cụm danh từ thông tin (INFO_*)
# Thuộc grammar Course Assistant; các file trong thư mục này được nạp theo thứ tự tên.
#
# Đề yêu cầu xử lý "câu hỏi/yêu cầu". Mỗi intent khai báo một cụm danh từ
# INFO_* chỉ thông tin được hỏi ("nội dung tuần 3", "deadline bài tập lớn").
# Cụm này dùng chung cho hai dạng:
#   câu hỏi : INFO_* + từ hỏi            "Nội dung tuần 3 là gì?"
#   yêu cầu : REQUEST_VERB_OPT + INFO_*           "Liệt kê tài liệu về CFG." / "Nội dung tuần 3."
# REQUEST_VERB_OPT có thể rỗng: một cụm danh từ đứng riêng cũng là một yêu cầu tra cứu.
# Trợ động từ tình thái "hãy", "bạn/thầy có thể" (MODAL_OPT) chỉ đứng ngay trước
# động từ yêu cầu ("Hãy liệt kê …", "Thầy có thể giải thích …"), không đứng
# trước cụm danh từ trần, nên "Hãy CFG." và "Thầy có thể tuần 5?" bị loại.
MODAL_OPT ->
MODAL_OPT -> "hãy"
MODAL_OPT -> "bạn có thể"
MODAL_OPT -> "thầy có thể"
REQUEST_VERB_OPT ->
REQUEST_VERB_OPT -> REQUEST_VERB
REQUEST_VERB -> MODAL_OPT REQUEST_VERB_CORE
REQUEST_VERB_CORE -> "cho tôi xem"
REQUEST_VERB_CORE -> "cho mình xem"
REQUEST_VERB_CORE -> "xem"
REQUEST_VERB_CORE -> "tra cứu"
REQUEST_VERB_CORE -> "tìm"
REQUEST_VERB_CORE -> "tìm hiểu"
REQUEST_VERB_CORE -> "nêu"
REQUEST_VERB_CORE -> "liệt kê"
REQUEST_VERB_CORE -> "trình bày"
REQUEST_VERB_CORE -> "mô tả"
REQUEST_VERB_CORE -> "tóm tắt"

# Động từ yêu cầu gắn với một loại câu hỏi kiến thức
REQUEST_EXPLAIN -> MODAL_OPT "giải thích"
REQUEST_COMPARE -> MODAL_OPT "so sánh"
