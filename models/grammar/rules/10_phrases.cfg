# ---------------------------------------------------------------------
# (2) CỤM DANH TỪ DÙNG CHUNG
# ---------------------------------------------------------------------
# Môn học
NP_COURSE -> COURSE_CLASS E_COURSE
NP_COURSE -> "môn học"
NP_COURSE -> "môn này"
COURSE_CLASS ->
COURSE_CLASS -> "môn"
COURSE_CLASS -> "khóa học"
COURSE_CLASS -> "học phần"
COURSE_CLASS -> "môn học"
OF_COURSE -> NP_COURSE
OF_COURSE -> "của" NP_COURSE
OF_COURSE_OPT ->
OF_COURSE_OPT -> "của" NP_COURSE
COURSE_MOD_OPT ->
COURSE_MOD_OPT -> OF_COURSE

# Thực thể có kiểu
NP_WEEK -> E_WEEK
NP_CHAPTER -> E_CHAPTER
NP_ASSIGNMENT -> E_ASSIGNMENT
NP_ASSIGNMENT -> E_CHAPTER_ASSIGNMENT
NP_PROJECT -> E_ASSIGNMENT
NP_PART -> E_PART
NP_EXAM -> E_EXAM
NP_LO -> E_LO
NP_REFERENCE -> E_REFERENCE

# Bài tập lớn và các phần của nó
ASSIGN_TARGET -> NP_ASSIGNMENT
ASSIGN_TARGET -> NP_PART
ASSIGN_TARGET -> NP_PART "của" NP_PROJECT
ASSIGN_TARGET -> NP_REFERENCE
OF_ASSIGN_TARGET -> ASSIGN_TARGET
OF_ASSIGN_TARGET -> "của" ASSIGN_TARGET

# Khái niệm: một thuật ngữ, có thể kèm loại từ hoặc chú thích trong ngoặc
NP_CONCEPT -> E_CONCEPT
NP_CONCEPT -> CONCEPT_CLASS E_CONCEPT
NP_CONCEPT -> E_CONCEPT "(" E_CONCEPT ")"
CONCEPT_CLASS -> "thuật toán"
CONCEPT_CLASS -> "giải thuật"
CONCEPT_CLASS -> "phương pháp"
CONCEPT_CLASS -> "mô hình"
CONCEPT_CLASS -> "mô hình chuỗi"
CONCEPT_CLASS -> "khái niệm"
CONCEPT_CLASS -> "kỹ thuật"
CONCEPT_CLASS -> "hiện tượng"
CONCEPT_CLASS -> "chỉ số"
CONCEPT_CLASS -> "ma trận"
CONCEPT_CLASS -> "lý thuyết"
CONCEPT_CLASS -> "bài toán"
CONCEPT_CLASS -> "bảng nhãn"

# Danh sách khái niệm (liệt kê bằng dấu phẩy, "và", "&")
CONJ -> "và"
CONJ -> "&"
CONCEPT_PAIR -> NP_CONCEPT CONJ NP_CONCEPT
CONCEPT_MULTI -> CONCEPT_PAIR
CONCEPT_MULTI -> NP_CONCEPT "," NP_CONCEPT CONJ NP_CONCEPT
CONCEPT_MULTI -> NP_CONCEPT "," NP_CONCEPT "," NP_CONCEPT
CONCEPT_MULTI -> NP_CONCEPT "," NP_CONCEPT "," NP_CONCEPT CONJ NP_CONCEPT
CONCEPT_MULTI -> NP_CONCEPT "," NP_CONCEPT "," NP_CONCEPT "," NP_CONCEPT
CONCEPT_LIST -> NP_CONCEPT
CONCEPT_LIST -> CONCEPT_MULTI

# Lượng từ, tính từ đánh giá
QUANT -> "các"
QUANT -> "những"
QUANT -> "một số"
QUANT -> "hai"
QUANT -> "ba"
QUANT -> "bốn"
QUANT_OPT ->
QUANT_OPT -> QUANT
IMPORTANCE ->
IMPORTANCE -> "chính"
IMPORTANCE -> "quan trọng"
IMPORTANCE -> "cơ bản"

# Danh từ tập hợp: đứng trước một nhóm thành viên ("ba tiêu chí ...")
SET_NOUN -> "tiêu chí"
SET_NOUN -> "dạng tri thức"
SET_NOUN -> "mốc thời gian"
SET_NOUN -> "nhóm ứng dụng"
SET_NOUN -> "toán tử"
SET_NOUN -> "độ chính xác"
SET_NOUN -> "loại"
SET_NOUN -> "thành phần"

# Phạm vi/ngữ cảnh của khái niệm ("trong ...", "giữa hai từ ...")
CONTEXT_CLASS ->
CONTEXT_CLASS -> "hệ thống"
CONTEXT_CLASS -> "mô hình"
CONTEXT_CLASS -> "phương pháp"
CONTEXT_CLASS -> "đánh giá"
CONTEXT_CLASS -> "lý thuyết của"
CONTEXT_NOUN -> "câu hỏi tiếng anh"
CONTEXT_NOUN -> "các mức biểu diễn ngôn ngữ"
CONTEXT_NOUN -> "hệ thống tri thức"
CONTEXT_NOUN -> "cửa sổ văn bản"
CONTEXT_NOUN -> "domain truy vấn chuyến bay"
CONTEXT_NOUN -> "slide"
CONTEXT_SIMPLE -> "trong" CONTEXT_CLASS CONCEPT_LIST
CONTEXT_SIMPLE -> "trong" CONTEXT_NOUN
CONTEXT -> CONTEXT_SIMPLE
CONTEXT -> "giữa hai từ" CONTEXT_SIMPLE
CONTEXT_OPT ->
CONTEXT_OPT -> CONTEXT

# Chủ thể của câu hỏi về kiến thức
#   TOPIC_HEAD: khái niệm/nhóm khái niệm, có thể có lượng từ, danh từ tập hợp
#   TOPIC_NP  : TOPIC_HEAD + phần bổ nghĩa (sở hữu, phạm vi, liệt kê)
TOPIC_HEAD -> QUANT_OPT CONCEPT_LIST
TOPIC_HEAD -> QUANT_OPT SET_NOUN IMPORTANCE
TOPIC_HEAD -> QUANT_OPT SET_NOUN IMPORTANCE CONCEPT_LIST
# TOPIC_CORE: chủ thể kiến thức không chứa tham chiếu
TOPIC_CORE -> TOPIC_HEAD
TOPIC_CORE -> TOPIC_HEAD "của" NP_CONCEPT
TOPIC_CORE -> TOPIC_HEAD CONTEXT_SIMPLE "(" CONCEPT_LIST ")"
TOPIC_CORE -> TOPIC_HEAD "như" CONCEPT_LIST
TOPIC_CORE -> QUANT_OPT NP_CONCEPT CONCEPT_MULTI
TOPIC_NP -> TOPIC_CORE
TOPIC_NP -> NP_REFERENCE

# Vùng chủ đề trong lịch/chương ("phần CFG và Parsing")
TOPIC_PREFIX ->
TOPIC_PREFIX -> "phần"
TOPIC_PREFIX -> "chủ đề"
TOPIC_AREA -> TOPIC_PREFIX NP_CONCEPT
TOPIC_AREA -> TOPIC_PREFIX CONCEPT_PAIR

# Bổ ngữ sở hữu cho chương và kỳ thi
OF_CHAPTER -> NP_CHAPTER
OF_CHAPTER -> "của" NP_CHAPTER
OF_EXAM -> NP_EXAM
OF_EXAM -> "của" NP_EXAM
