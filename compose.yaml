services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CHAT_DB_PATH: /project/output/web/chat.sqlite3
      WEB_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      # Ollama runs on the host (ollama serve); the container reaches it here.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chat-data:/project/output
volumes:
  chat-data:
